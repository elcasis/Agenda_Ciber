<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f19" />
  <title>CyberVault — Notas de Ciberseguridad</title>
  <style>
    :root {
      --font-scale: 1;
      --bg-primary: #0b0f19;
      --bg-card: #131b2e;
      --bg-input: #0e1424;
      --border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      /* Colores por categoría */
      --osint-color: #10b981;
      --osint-bg: rgba(16, 185, 129, 0.12);
      --red-color: #f43f5e;
      --red-bg: rgba(244, 63, 94, 0.12);
      --blue-color: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.12);

      --active-color: var(--osint-color);
      --active-bg: var(--osint-bg);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: calc(95px + env(safe-area-inset-bottom, 20px));
      padding-top: env(safe-area-inset-top, 0px);
      overflow-x: hidden;
    }

    /* CABECERA */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 15, 25, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      max-width: 720px;
      margin: 0 auto 0.65rem auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--active-color);
      box-shadow: 0 0 10px var(--active-color);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.4rem 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* PANEL DE TAMAÑO DE FUENTE */
    .font-drawer {
      display: none;
      max-width: 720px;
      margin: 0 auto 0.65rem auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .font-drawer.open {
      display: flex;
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .font-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .font-btn.active {
      border-color: var(--active-color);
      color: var(--active-color);
      background: var(--active-bg);
    }

    /* BUSCADOR */
    .search-wrap {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 2.2rem 0.65rem 2.3rem;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--active-color);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .clear-search {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 0.2rem;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.85rem 1rem;
    }

    /* SUBCATEGORÍAS (CHIPS DESLIZABLES) */
    .subcats-bar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .subcats-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .chip.active {
      background: var(--active-bg);
      border-color: var(--active-color);
      color: var(--active-color);
    }

    .chip-add {
      border-style: dashed;
      color: var(--text-main);
    }

    .chip-del {
      margin-left: 0.15rem;
      opacity: 0.7;
      font-size: 0.85rem;
    }

    /* FILTRO POR TIPO */
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .count-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .type-select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem 0.55rem;
      font-size: 0.8rem;
      outline: none;
    }

    /* TARJETAS DE APUNTES */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--active-color);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      word-break: break-word;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .card-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.55rem;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.18rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-subcat {
      background: var(--active-bg);
      color: var(--active-color);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .badge-type {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
    }

    .card-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-line;
      margin-bottom: 0.5rem;
    }

    .cmd-box {
      background: #070a12;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      font-family: "SF Mono", Consolas, Menlo, monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      overflow-x: auto;
      margin-top: 0.4rem;
    }

    .cmd-text {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .copy-btn {
      background: #131b2e;
      border: 1px solid #283548;
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.2rem 0.45rem;
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .empty-state p {
      margin-top: 0.4rem;
      font-size: 0.9rem;
    }

    /* BOTÓN FLOTANTE (AÑADIR) */
    .fab {
      position: fixed;
      right: 1.15rem;
      bottom: calc(76px + env(safe-area-inset-bottom, 12px));
      z-index: 35;
      background: var(--active-color);
      color: #060911;
      border: none;
      border-radius: 999px;
      padding: 0.8rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* NAVEGACIÓN INFERIOR (3 CATEGORÍAS PRINCIPALES) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(13, 19, 33, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 0.45rem 0.75rem calc(0.45rem + env(safe-area-inset-bottom, 10px)) 0.75rem;
    }

    .nav-inner {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 0.25rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .nav-tab span.icon {
      font-size: 1.15rem;
    }

    .nav-tab.active[data-cat="OSIM"] {
      background: var(--osint-bg);
      color: var(--osint-color);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .nav-tab.active[data-cat="Red Team"] {
      background: var(--red-bg);
      color: var(--red-color);
      border-color: rgba(244, 63, 94, 0.35);
    }

    .nav-tab.active[data-cat="Blue Team"] {
      background: var(--blue-bg);
      color: var(--blue-color);
      border-color: rgba(56, 189, 248, 0.35);
    }

    /* MODALES */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(4, 7, 13, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 600px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 1.15rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom, 16px)) 1.1rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
      }
      .modal-sheet {
        border: 1px solid var(--border);
        border-radius: 18px;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .close-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 0.85rem;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .form-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--active-color);
    }

    textarea.form-control {
      min-height: 85px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .btn-primary {
      width: 100%;
      background: var(--active-color);
      color: #060911;
      border: none;
      padding: 0.8rem;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0.35rem;
    }

    .inline-new-subcat {
      display: none;
      gap: 0.4rem;
      margin-top: 0.45rem;
    }

    .inline-new-subcat.show {
      display: flex;
    }

    .toast {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--active-color);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 100;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- CABECERA -->
  <header>
    <div class="top-bar">
      <div class="brand">
        <span class="brand-dot" id="brandDot"></span>
        <span id="headerTitle">OSIM / OSINT</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnToggleFont" title="Cambiar tamaño de letra">Aa</button>
        <button class="icon-btn" id="btnExport" title="Exportar copia de seguridad">⬇️</button>
        <button class="icon-btn" id="btnImport" title="Importar copia de seguridad">⬆️</button>
        <input type="file" id="fileImport" accept=".json" style="display:none" />
      </div>
    </div>

    <!-- AJUSTE DE TAMAÑO DE FUENTE -->
    <div class="font-drawer" id="fontDrawer">
      <span style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">Tamaño de letra:</span>
      <div class="font-controls">
        <button class="font-btn" data-scale="0.9">A-</button>
        <button class="font-btn active" data-scale="1">Normal</button>
        <button class="font-btn" data-scale="1.15">A+</button>
        <button class="font-btn" data-scale="1.3">A++</button>
      </div>
    </div>

    <!-- BUSCADOR -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" class="search-input" placeholder="Buscar herramienta, ataque, comando..." />
      <button class="clear-search" id="btnClearSearch">✕</button>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main>
    <!-- BARRA DE SUBCATEGORÍAS -->
    <div class="subcats-bar" id="subcatsBar"></div>

    <!-- FILTRO SECUNDARIO -->
    <div class="filter-row">
      <span class="count-label" id="countLabel">0 anotaciones</span>
      <select class="type-select" id="typeFilter">
        <option value="ALL">Todos los tipos</option>
        <option value="Herramienta">🛠️ Herramienta</option>
        <option value="Ataque">⚔️ Ataque</option>
        <option value="Defensa">🛡️ Defensa</option>
        <option value="Método / Concepto">📘 Método / Concepto</option>
        <option value="Comando / Payload">💻 Comando / Payload</option>
      </select>
    </div>

    <!-- LISTA DE TARJETAS -->
    <div class="cards-list" id="cardsList"></div>
  </main>

  <!-- BOTÓN FLOTANTE AÑADIR -->
  <button class="fab" id="btnNewNote">＋ Anotar</button>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <button class="nav-tab active" data-cat="OSIM">
        <span class="icon">🕵️</span>
        <span>OSIM / OSINT</span>
      </button>
      <button class="nav-tab" data-cat="Red Team">
        <span class="icon">⚔️</span>
        <span>Red Team</span>
      </button>
      <button class="nav-tab" data-cat="Blue Team">
        <span class="icon">🛡️</span>
        <span>Blue Team</span>
      </button>
    </div>
  </nav>

  <!-- MODAL AÑADIR / EDITAR ANOTACIÓN -->
  <div class="modal-backdrop" id="noteModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Nueva Anotación</span>
        <button class="close-btn" id="btnCloseModal">✕</button>
      </div>
      <form id="noteForm">
        <input type="hidden" id="noteId" />

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Categoría Principal</label>
            <select id="noteCategory" class="form-control" required>
              <option value="OSIM">OSIM / OSINT</option>
              <option value="Red Team">Red Team</option>
              <option value="Blue Team">Blue Team</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select id="noteType" class="form-control" required>
              <option value="Herramienta">🛠️ Herramienta</option>
              <option value="Ataque">⚔️ Ataque</option>
              <option value="Defensa">🛡️ Defensa</option>
              <option value="Método / Concepto">📘 Método / Concepto</option>
              <option value="Comando / Payload">💻 Comando / Payload</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Subcategoría (opcional o crea una nueva)</label>
          <div style="display:flex; gap:0.4rem;">
            <select id="noteSubcat" class="form-control"></select>
            <button type="button" class="icon-btn" id="btnShowNewSubcat" style="flex-shrink:0;">+ Nueva</button>
          </div>
          <div class="inline-new-subcat" id="inlineNewSubcat">
            <input type="text" id="newSubcatInput" class="form-control" placeholder="Nombre de nueva subcategoría..." />
            <button type="button" class="icon-btn" id="btnAddSubcatInline" style="border-color:var(--active-color); color:var(--active-color);">Guardar</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Nombre (Herramienta, Ataque, Técnica...)</label>
          <input type="text" id="noteName" class="form-control" placeholder="Ej: Shodan, Kerberoasting, Wazuh..." required />
        </div>

        <div class="form-group">
          <label class="form-label">Descripción / Para qué sirve</label>
          <textarea id="noteDesc" class="form-control" placeholder="Escribe qué hace, cuándo se usa o cómo funciona..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Comando / Ejemplo / URL (Opcional)</label>
          <input type="text" id="noteCmd" class="form-control" placeholder="Ej: nmap -sC -sV 10.10.10.5" />
        </div>

        <button type="submit" class="btn-primary">Guardar Anotación</button>
      </form>
    </div>
  </div>

  <!-- MODAL NUEVA SUBCATEGORÍA RÁPIDA -->
  <div class="modal-backdrop" id="subcatModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="subcatModalTitle">Nueva Subcategoría</span>
        <button class="close-btn" id="btnCloseSubcatModal">✕</button>
      </div>
      <form id="subcatForm">
        <div class="form-group">
          <label class="form-label">Nombre de la subcategoría</label>
          <input type="text" id="quickSubcatName" class="form-control" placeholder="Ej: Reconocimiento Pasivo, Active Directory, SIEM..." required />
        </div>
        <button type="submit" class="btn-primary">Crear Subcategoría</button>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'cybervault_data_v1';
    const FONT_KEY = 'cybervault_font_scale';

    const DEFAULT_DATA = {
      subcategories: {
        "OSIM": ["Buscadores", "Dominios y Redes", "Personas / Redes Sociales", "Metadatos"],
        "Red Team": ["Reconocimiento", "Explotación Web", "Active Directory", "Escalada de Privilegios", "Fuerza Bruta"],
        "Blue Team": ["SIEM / Logs", "Análisis de Red", "Respuesta a Incidentes", "Hardening"]
      },
      notes: [
        {
          id: "demo-1",
          category: "OSIM",
          subcat: "Buscadores",
          type: "Herramienta",
          name: "Shodan",
          desc: "Motor de búsqueda para dispositivos conectados a Internet (IoT, servidores, cámaras, puertos abiertos y banners de servicios).",
          cmd: "port:3389 country:\"ES\" org:\"Empresa\""
        },
        {
          id: "demo-2",
          category: "OSIM",
          subcat: "Dominios y Redes",
          type: "Herramienta",
          name: "theHarvester",
          desc: "Recopilación de correos electrónicos, subdominios, IPs y nombres de empleados usando fuentes públicas.",
          cmd: "theHarvester -d ejemplo.com -b all"
        },
        {
          id: "demo-3",
          category: "Red Team",
          subcat: "Active Directory",
          type: "Ataque",
          name: "Kerberoasting",
          desc: "Ataque contra Active Directory que solicita tickets TGS de cuentas de servicio (SPN) para luego crackear sus hashes offline con Hashcat o John.",
          cmd: "impacket-GetUserSPNs dominio.local/usuario:password -dc-ip 10.10.10.5 -request"
        },
        {
          id: "demo-4",
          category: "Red Team",
          subcat: "Reconocimiento",
          type: "Herramienta",
          name: "Nmap",
          desc: "Escáner de puertos, detección de versiones de servicios y sistema operativo.",
          cmd: "nmap -p- --open -sS --min-rate 5000 -vvv -n -Pn 10.10.10.10"
        },
        {
          id: "demo-5",
          category: "Blue Team",
          subcat: "SIEM / Logs",
          type: "Herramienta",
          name: "Wazuh",
          desc: "Plataforma libre de SIEM y XDR para detección de intrusiones, monitoreo de integridad de archivos (FIM) y respuesta activa.",
          cmd: "systemctl status wazuh-manager"
        },
        {
          id: "demo-6",
          category: "Blue Team",
          subcat: "Hardening",
          type: "Defensa",
          name: "Principio de Mínimo Privilegio (PoLP)",
          desc: "Método defensivo donde cada usuario, proceso o servicio tiene únicamente los permisos estrictamente necesarios para realizar su función.",
          cmd: ""
        }
      ]
    };

    let state = {
      activeCat: "OSIM",
      activeSubcat: "ALL",
      activeType: "ALL",
      search: "",
      data: loadData()
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
        const parsed = JSON.parse(raw);
        if (!parsed.subcategories || !parsed.notes) return JSON.parse(JSON.stringify(DEFAULT_DATA));
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.style.display = 'none';
      }, 2200);
    }

    function applyThemeForCategory(cat) {
      const root = document.documentElement;
      const title = document.getElementById('headerTitle');
      if (cat === "OSIM") {
        root.style.setProperty('--active-color', 'var(--osint-color)');
        root.style.setProperty('--active-bg', 'var(--osint-bg)');
        title.textContent = "OSIM / OSINT";
      } else if (cat === "Red Team") {
        root.style.setProperty('--active-color', 'var(--red-color)');
        root.style.setProperty('--active-bg', 'var(--red-bg)');
        title.textContent = "Red Team";
      } else {
        root.style.setProperty('--active-color', 'var(--blue-color)');
        root.style.setProperty('--active-bg', 'var(--blue-bg)');
        title.textContent = "Blue Team";
      }
    }

    function renderSubcategories() {
      const bar = document.getElementById('subcatsBar');
      bar.innerHTML = '';

      const subcats = state.data.subcategories[state.activeCat] || [];

      const allChip = document.createElement('button');
      allChip.className = 'chip' + (state.activeSubcat === 'ALL' ? ' active' : '');
      allChip.textContent = 'Todas';
      allChip.onclick = () => {
        state.activeSubcat = 'ALL';
        renderAll();
      };
      bar.appendChild(allChip);

      const directChip = document.createElement('button');
      directChip.className = 'chip' + (state.activeSubcat === 'NONE' ? ' active' : '');
      directChip.textContent = 'Directo (Sin subcat.)';
      directChip.onclick = () => {
        state.activeSubcat = 'NONE';
        renderAll();
      };
      bar.appendChild(directChip);

      subcats.forEach(sc => {
        const chip = document.createElement('button');
        chip.className = 'chip' + (state.activeSubcat === sc ? ' active' : '');
        const label = document.createElement('span');
        label.textContent = sc;
        chip.appendChild(label);

        if (state.activeSubcat === sc) {
          const del = document.createElement('span');
          del.className = 'chip-del';
          del.textContent = '✕';
          del.title = 'Eliminar subcategoría';
          del.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`¿Eliminar la subcategoría "${sc}"? Las notas dentro pasarán a Directo (sin subcategoría).`)) {
              state.data.subcategories[state.activeCat] = subcats.filter(item => item !== sc);
              state.data.notes.forEach(n => {
                if (n.category === state.activeCat && n.subcat === sc) {
                  n.subcat = '';
                }
              });
              state.activeSubcat = 'ALL';
              saveData();
              renderAll();
              showToast('Subcategoría eliminada');
            }
          };
          chip.appendChild(del);
        }

        chip.onclick = () => {
          state.activeSubcat = sc;
          renderAll();
        };
        bar.appendChild(chip);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'chip chip-add';
      addBtn.textContent = '+ Subcategoría';
      addBtn.onclick = () => {
        document.getElementById('subcatModalTitle').textContent = `Nueva Subcategoría en ${state.activeCat}`;
        document.getElementById('quickSubcatName').value = '';
        document.getElementById('subcatModal').classList.add('open');
        setTimeout(() => document.getElementById('quickSubcatName').focus(), 100);
      };
      bar.appendChild(addBtn);
    }

    function renderCards() {
      const list = document.getElementById('cardsList');
      list.innerHTML = '';

      const q = state.search.trim().toLowerCase();

      const filtered = state.data.notes.filter(n => {
        if (n.category !== state.activeCat) return false;
        if (state.activeSubcat === 'NONE' && n.subcat) return false;
        if (state.activeSubcat !== 'ALL' && state.activeSubcat !== 'NONE' && n.subcat !== state.activeSubcat) return false;
        if (state.activeType !== 'ALL' && n.type !== state.activeType) return false;
        if (q) {
          const hay = `${n.name} ${n.desc} ${n.subcat || ''} ${n.type} ${n.cmd || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById('countLabel').textContent = `${filtered.length} ${filtered.length === 1 ? 'anotación' : 'anotaciones'}`;

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `
          <strong>No hay anotaciones aquí todavía</strong>
          <p>Pulsa el botón <b>"＋ Anotar"</b> para guardar una herramienta, ataque, defensa o método.</p>
        `;
        list.appendChild(empty);
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'card-header';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = note.name;

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'card-btn';
        editBtn.textContent = '✏️';
        editBtn.onclick = () => openNoteModal(note);

        const delBtn = document.createElement('button');
        delBtn.className = 'card-btn';
        delBtn.textContent = '🗑️';
        delBtn.onclick = () => {
          if (confirm(`¿Borrar "${note.name}"?`)) {
            state.data.notes = state.data.notes.filter(item => item.id !== note.id);
            saveData();
            renderCards();
            showToast('Anotación eliminada');
          }
        };

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        header.appendChild(title);
        header.appendChild(actions);

        const badges = document.createElement('div');
        badges.className = 'badges';

        const typeBadge = document.createElement('span');
        typeBadge.className = 'badge badge-type';
        typeBadge.textContent = note.type;
        badges.appendChild(typeBadge);

        if (note.subcat) {
          const subBadge = document.createElement('span');
          subBadge.className = 'badge badge-subcat';
          subBadge.textContent = note.subcat;
          badges.appendChild(subBadge);
        }

        card.appendChild(header);
        card.appendChild(badges);

        if (note.desc) {
          const desc = document.createElement('div');
          desc.className = 'card-desc';
          desc.textContent = note.desc;
          card.appendChild(desc);
        }

        if (note.cmd) {
          const cmdBox = document.createElement('div');
          cmdBox.className = 'cmd-box';

          const cmdText = document.createElement('span');
          cmdText.className = 'cmd-text';
          cmdText.textContent = note.cmd;

          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = 'Copiar';
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(note.cmd).then(() => {
              showToast('Copiado al portapapeles');
            });
          };

          cmdBox.appendChild(cmdText);
          cmdBox.appendChild(copyBtn);
          card.appendChild(cmdBox);
        }

        list.appendChild(card);
      });
    }

    function renderAll() {
      applyThemeForCategory(state.activeCat);
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === state.activeCat);
      });
      renderSubcategories();
      renderCards();
    }

    function populateFormSubcats(cat, selectedSubcat = '') {
      const sel = document.getElementById('noteSubcat');
      sel.innerHTML = '';

      const optNone = document.createElement('option');
      optNone.value = '';
      optNone.textContent = '— Directo (Sin subcategoría) —';
      sel.appendChild(optNone);

      const list = state.data.subcategories[cat] || [];
      list.forEach(sc => {
        const opt = document.createElement('option');
        opt.value = sc;
        opt.textContent = sc;
        if (sc === selectedSubcat) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function openNoteModal(note = null) {
      const modal = document.getElementById('noteModal');
      document.getElementById('inlineNewSubcat').classList.remove('show');
      document.getElementById('newSubcatInput').value = '';

      if (note) {
        document.getElementById('modalTitle').textContent = 'Editar Anotación';
        document.getElementById('noteId').value = note.id;
        document.getElementById('noteCategory').value = note.category;
        populateFormSubcats(note.category, note.subcat);
        document.getElementById('noteType').value = note.type;
        document.getElementById('noteName').value = note.name;
        document.getElementById('noteDesc').value = note.desc || '';
        document.getElementById('noteCmd').value = note.cmd || '';
      } else {
        document.getElementById('modalTitle').textContent = 'Nueva Anotación';
        document.getElementById('noteId').value = '';
        document.getElementById('noteCategory').value = state.activeCat;
        const defaultSub = (state.activeSubcat !== 'ALL' && state.activeSubcat !== 'NONE') ? state.activeSubcat : '';
        populateFormSubcats(state.activeCat, defaultSub);
        document.getElementById('noteType').value = state.activeType !== 'ALL' ? state.activeType : 'Herramienta';
        document.getElementById('noteName').value = '';
        document.getElementById('noteDesc').value = '';
        document.getElementById('noteCmd').value = '';
      }

      modal.classList.add('open');
      setTimeout(() => document.getElementById('noteName').focus(), 100);
    }

    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeCat = btn.dataset.cat;
        state.activeSubcat = 'ALL';
        renderAll();
      });
    });

    document.getElementById('noteCategory').addEventListener('change', (e) => {
      populateFormSubcats(e.target.value, '');
    });

    document.getElementById('btnShowNewSubcat').addEventListener('click', () => {
      const box = document.getElementById('inlineNewSubcat');
      box.classList.toggle('show');
      if (box.classList.contains('show')) {
        document.getElementById('newSubcatInput').focus();
      }
    });

    document.getElementById('btnAddSubcatInline').addEventListener('click', () => {
      const val = document.getElementById('newSubcatInput').value.trim();
      const cat = document.getElementById('noteCategory').value;
      if (!val) return;
      if (!state.data.subcategories[cat].includes(val)) {
        state.data.subcategories[cat].push(val);
        saveData();
      }
      populateFormSubcats(cat, val);
      document.getElementById('newSubcatInput').value = '';
      document.getElementById('inlineNewSubcat').classList.remove('show');
      renderSubcategories();
      showToast(`Subcategoría "${val}" añadida`);
    });

    document.getElementById('btnCloseSubcatModal').addEventListener('click', () => {
      document.getElementById('subcatModal').classList.remove('open');
    });

    document.getElementById('subcatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('quickSubcatName').value.trim();
      if (!val) return;
      const list = state.data.subcategories[state.activeCat];
      if (!list.includes(val)) {
        list.push(val);
        saveData();
      }
      state.activeSubcat = val;
      document.getElementById('subcatModal').classList.remove('open');
      renderAll();
      showToast(`Subcategoría "${val}" creada`);
    });

    document.getElementById('btnNewNote').addEventListener('click', () => openNoteModal());
    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('noteModal').classList.remove('open');
    });

    document.getElementById('noteForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('noteId').value;
      const category = document.getElementById('noteCategory').value;
      const subcat = document.getElementById('noteSubcat').value;
      const type = document.getElementById('noteType').value;
      const name = document.getElementById('noteName').value.trim();
      const desc = document.getElementById('noteDesc').value.trim();
      const cmd = document.getElementById('noteCmd').value.trim();

      if (!name) return;

      if (id) {
        const idx = state.data.notes.findIndex(n => n.id === id);
        if (idx !== -1) {
          state.data.notes[idx] = { id, category, subcat, type, name, desc, cmd };
        }
        showToast('Anotación actualizada');
      } else {
        const newNote = {
          id: 'n-' + Date.now(),
          category,
          subcat,
          type,
          name,
          desc,
          cmd
        };
        state.data.notes.unshift(newNote);
        showToast('Anotación guardada');
      }

      state.activeCat = category;
      saveData();
      document.getElementById('noteModal').classList.remove('open');
      renderAll();
    });

    const searchInput = document.getElementById('searchInput');
    const btnClearSearch = document.getElementById('btnClearSearch');

    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      btnClearSearch.style.display = state.search ? 'block' : 'none';
      renderCards();
    });

    btnClearSearch.addEventListener('click', () => {
      state.search = '';
      searchInput.value = '';
      btnClearSearch.style.display = 'none';
      renderCards();
    });

    document.getElementById('typeFilter').addEventListener('change', (e) => {
      state.activeType = e.target.value;
      renderCards();
    });

    const fontDrawer = document.getElementById('fontDrawer');
    document.getElementById('btnToggleFont').addEventListener('click', () => {
      fontDrawer.classList.toggle('open');
    });

    function setFontScale(scale) {
      document.documentElement.style.setProperty('--font-scale', scale);
      localStorage.setItem(FONT_KEY, scale);
      document.querySelectorAll('.font-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scale === String(scale));
      });
    }

    document.querySelectorAll('.font-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        setFontScale(btn.dataset.scale);
      });
    });

    const savedFont = localStorage.getItem(FONT_KEY) || '1';
    setFontScale(savedFont);

    document.getElementById('btnExport').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.data, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `cybervault_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Copia descargada');
    });

    document.getElementById('btnImport').addEventListener('click', () => {
      document.getElementById('fileImport').click();
    });

    document.getElementById('fileImport').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported.subcategories && Array.isArray(imported.notes)) {
            state.data = imported;
            saveData();
            renderAll();
            showToast('Notas importadas con éxito');
          } else {
            alert('El archivo no tiene el formato correcto.');
          }
        } catch (err) {
          alert('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) backdrop.classList.remove('open');
      });
    });

    renderAll();
  </script>
</body>
</html>
